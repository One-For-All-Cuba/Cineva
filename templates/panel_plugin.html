{% extends "base.html" %}
{% block title %}Proveedor {{ plugin.name }}{% endblock %}
{% block content %}
<div class="wrap panel-wrap">
  <p><a href="/panel/" style="color:var(--muted)">← Panel</a></p>
  <h1 class="page-title">{{ plugin.name }}</h1>
  <form method="post" class="plugin-form">
    {% csrf_token %}
    <label class="check-row">
      <input type="checkbox" name="enabled" {% if plugin.enabled %}checked{% endif %}>
      Activar proveedor
    </label>
    <label>Nombre
      <input type="text" name="name" value="{{ plugin.name }}">
    </label>
    <label>Descripción
      <textarea name="description" rows="2">{{ plugin.description }}</textarea>
    </label>
    <label>URL embed (usa {id} y opcional {type})
      <input type="text" name="embed_url" value="{{ plugin.embed_url }}" placeholder="https://…/{id}">
    </label>
    <label>Prioridad (menor = primero)
      <input type="text" name="priority" value="{{ plugin.priority }}">
    </label>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>
</div>
{% endblock %}
